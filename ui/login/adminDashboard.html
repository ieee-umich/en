<body class="is-preload">

    <!-- Page Wrapper -->
    <div id="page-wrapper">

        <!-- Header -->
        <header id="header">
            <h1><a href="index.html">Welcome Admin</a></h1>
            <nav>
                <a href="index.html">Home</a>
            </nav>
        </header>

        <!-- Menu -->
        <nav id="menu">
            <div class="inner">
                <h2>Menu</h2>
                <ul class="links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="generic.html">Generic</a></li>
                    <li><a href="elements.html">Elements</a></li>

                </ul>
                <a href="#" class="close">Close</a>
            </div>
        </nav>

        <!-- Wrapper -->
        <section id="wrapper">
            <header>
                <div class="inner">
                    <h2>Points Manager</h2>
                    <p>Add, deduct, and authorize members</p>
                </div>
            </header>

            <!-- Content -->
            <div class="wrapper">
                <div class="inner">
                    <section>
                        <h3 class="major">Point change request</h3>
                        <form id="pointsform" method="post">
                            <div class="row gtr-uniform">
                                <div class="col-6 col-12-xsmall">
                                    <label for="unique_name">Unique Name</label>
                                    <input type="text" name="unique_name" id="unique_name" value="" />
                                </div>
                                <div class="col-12">
                                    <label for="scale">Points Adjustment</label>
                                    <select name="scale" id="scale">
                                        <option value="0">0</option>
                                        <option value="-50">-50</option>
                                        <option value="-20">-20</option>
                                        <option value="-10">-10</option>
                                        <option value="-5">-5</option>
                                        <option value="5">5</option>
                                        <option value="10">10</option>
                                        <option value="20">20</option>
                                        <option value="50">50</option>
                                    </select>
                                </div>
                                <div class="col-6 col-12-small">
                                    <input type="checkbox" id="isnewadmin" name="isnewadmin">
                                    <!-- default unchecked, it want to check, add 'checked' -->
                                    <label for="isnewadmin">Add as an admin</label>

                                </div>
                                <div class="col-6 col-12-small">
                                    <input type="checkbox" id="isnewmember" name="isnewmember">
                                    <label for="isnewmember">Add as a new member</label>
                                </div>

                                <!-- <div class="col-12">
                                    <label for="demo-message">Message</label>
                                    <textarea name="demo-message" id="demo-message" rows="6"></textarea>
                                </div> -->
                                <div class="col-12">
                                    <ul class="actions">
                                        <ul class="actions">
                                            <li><button type="submit" class="button primary">Send</button></li>
                                        </ul>
                                    </ul>
                                </div>
                            </div>
                            
                        </form>
                    </section>

                </div>
            </div>

        </section>

        <!-- Footer -->
        <section id="footer">

            <div class="inner">

                    </li>
                </ul>
            </div>

        </section>

    </div>

    <!-- Scripts -->
    <script src="/assets/js/jquery.min.js"></script>
